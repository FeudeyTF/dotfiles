input_tab_size                  = 4
output_tab_size                 = 4
indent_columns                  = 4
indent_with_tabs                = 0

nl_assign_brace                 = force 
nl_enum_brace                   = force
nl_union_brace                  = force
nl_struct_brace                 = force
nl_class_brace                  = force
nl_do_brace                     = force
nl_if_brace                     = force
nl_for_brace                    = force
nl_else_brace                   = force
nl_while_brace                  = force
nl_switch_brace                 = force
nl_synchronized_brace           = force
nl_fdef_brace                   = force

nl_brace_else                   = force
nl_inline_brace                 = false

indent_class                    = true
indent_access_spec              = 4

sp_before_sparen                = force
sp_after_sparen                 = force
sp_inside_sparen                = remove
sp_arith                        = force
sp_assign                       = force
sp_bool                         = force

